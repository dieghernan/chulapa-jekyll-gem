# Chulapa configuration
# Sections follow https://dieghernan.github.io/chulapa/docs/02-config
# Blank settings use theme defaults where available.

# Installation (see docs/01-install)
# Keep GitHub metadata enabled.
github: [metadata]

# Use the installed RubyGems theme.
theme: chulapa-jekyll
# The Gemfile declares the chulapa-jekyll dependency.

# A. Site settings/SEO
# General site settings
locale                  :     #default["en-US"] format language-TERRITORY , e.g fr, en-GB, es-MX, pt-BR
title                   : Chulapa 101    #default["repository_name"]
title_separator         :     #default [" | "]
subtitle                : Chulapa Jekyll Theme starter pack    #default [your-repository-tagline]
description             : Chulapa Jekyll Theme starter pack #default [your-repository-tagline]
url: https://dieghernan.github.io
baseurl: /chulapa-jekyll-gem
repository              :     dieghernan/chulapa-jekyll-gem # Needs to be set (e.g. dieghernan/chulapa)
words_per_minute        :     #default[200]
timezone                :     # e.g. Europe/Madrid. See https://jekyllrb.com/docs/configuration/options/

# A.1. SEO
# Social locales: docs/04-layouts#social-locales-and-articles.
og_locale               :     # Optional language_TERRITORY for social metadata
og_locale_alternate     : []  # Optional list of translated locales, e.g. [es_ES, fr_FR]
og_image                :     #default[author.avatar (see below)] or [github-avatar]
# Describe the site image above. These values apply when a page uses that image.
# og_image_alt: A street in Madrid
# og_image_width: 1200
# og_image_height: 630
# og_image_type: image/jpeg
twitter_site            :     #Avoid @
# Site author
author:
  url: # Optional author profile URL or site-relative path, e.g. /about/.
  name                  : Your Name # Name Surname Company
  avatar                :     # Try a square file. Info: Your github avatar on https://github.com/[USERNAME].png
  location              : "Madrid, Spain" # New York, USA
  links:
    - url:  #A link or email: https://twitter.com/jack, mail@example.com
      icon: # A Fontawesome code: fab fa-twitter - see https://fontawesome.com/
      label: # A Label for the icon: Twitter
    - url:  # Another link
      icon: # Another FontAwesome code
      label: # Another label

# A.1.1. Publisher
# Optional JSON-LD publisher, independent of article authors.
publisher:
  type: # Organization (default) or Person; unsupported types use Organization
  name: # Defaults to author.name or GitHub owner name
  url: # Defaults to the site home URL
  logo: # Organization only; defaults to og_image, author.avatar or GitHub avatar
  image: # Person defaults to author.avatar or GitHub avatar; optional for Organization

# A.2. Font Awesome
fa_version: # Defaults to 7. Set to 6 or 5 to use an older version.
fa_kit_code: # Optional Font Awesome kit code. Without a kit, load the free hosted version.
fa_v4_support: # Set to true for v4 compatibility with hosted stylesheets. With a kit, configure compatibility in the kit settings.
# fa5_kit_code: your-kit-code # Legacy kit key. Takes precedence over fa_kit_code.
# A.3. Google Analytics
# gtag_id: Google Analytics 4 measurement ID, e.g. G-XXXXXXXXXX.
# analytics_id: legacy Universal Analytics ID; use gtag_id for new setups.
# Leave unused IDs empty. Setting both loads both snippets.
gtag_id                 :
analytics_id            :

# Optional GoatCounter public HTTPS /count endpoint (2.2.0); production only.
# Hosted: https://YOUR-CODE.goatcounter.com/count; self-hosted URLs work too.
goatcounter:

# A.4. Search engines
# Create a page with layout: search and a permalink matching landing_page.
# Available free search engines:
# - lunr https://lunrjs.com/
# - algolia v4 https://www.algolia.com/ - needs further configuration
# - google custom search engine https://cse.google.es/
# - simplesearch: https://github.com/christian-fei/Simple-Jekyll-Search
# - fusejs: https://fusejs.io/
search:
  provider              : fusejs # Enable search: lunr, algolia, google, simplesearch or fusejs.
  label                 :  #default ["Search"] Text on navbar when search is enabled
  landing_page          : /search.html # Matches the existing search page permalink.
  maxwords              :  #default [30] lunr simplesearch, fusejs only - May slow down your site build
  show_attrib           :   #default ["true"] Show attributions/logo on search engine
  algolia_logo          :  true # Check your plan's attribution requirements before hiding the logo.

  # Legacy provider-specific limits take precedence over maxwords.
  # lunr_maxwords: 30
  # simplesearch_maxwords: 30
  # fusejs_maxwords: 30

google_cse_id: #Your cse id
# Algolia indexing uses jekyll-algolia. Adapt these indexing options to your site.
algolia:
  application_id        : #As per your Algolia account
  index_name            : #As per your Algolia account
  search_only_api_key   : #As per your Algolia account
  files_to_exclude:         #Optional
    - _layouts/*.html
    - _includes/*.html
  extensions_to_index:      #Optional
    - html
    - md
  # nodes_to_index: 'p,h2,h3,h4,li' # CSS selector for rendered elements. The plugin defaults to p.
  settings:
    searchableAttributes:
      - title
      - headings
      - unordered(content)
      - unordered(subtitle)
      - unordered(categories)
      - unordered(collection)
      - unordered(tags)
    customRanking:
      - desc(include_on_search)
      - desc(title)
      - desc(content)
      - desc(subtitle)

# A.5. Comments
# Enable show_comments on pages that should display comments.
# For giscus, place its script in _includes/custom/giscus.html.
comments:
  provider:         # disqus, cusdis, giscus, cactus or welcomments
  disqus_shortname: #Your site id : check your address https://{{ disqus.shortname }}.disqus.com/admin/
  cactus_shortname: #Your site id as registered with Cactus.chat
  cusdis_app_id:    # Your cusdis app id
  cusdis_host:      # Optionally you can use your own host
  website_id:       # Welcomments id

# B. Navigation
# Configure your navbar and the footer of your site

# B.1. Navbar and footer
navbar:
  style     :  #default is the classical top navbar, set "fab" for a floating action button navbar or "dual"
  expand    :  # At which device size expand the navbar menu. default[md] https://getbootstrap.com/docs/4.6/layout/overview/
  brand:
    title   :  Home # Title in navbar
    url     :  # default["url/baseurl"]
    img     :  # An small image, try 30x30px
  nav:
  - title   : Blog # Label
    url     : /blog/ # url
  - title   : Cheatsheets
    url     : /cheatsheets
  - title   : Extras
    child   :
      - title : Tags
        url   : /tags
      - title : Categories
        url   : /categories
      - title : Archive
        url   : /archive
      - title : Current skin
        url   : /current-skin
  - title   : Docs
    url     : https://dieghernan.github.io/chulapa/docs/01-install
  - title   : Source code
    url     : https://github.com/dieghernan/chulapa-jekyll-gem
#  - title   : # Label submenu
#    child:
#    - title: # Child label
#      url  : # child url
#    - title: # Child label
#      url  : # child url
#Social links to be placed on your site footer
footer:
  links:
    - label : Repo on Github # Label
      icon  : fab fa-github # Fontawesome 5 icon
      url   : https://github.com/dieghernan/chulapa-jekyll-gem # A link or email: https://twitter.com/jack, mail@example.com
    - label: "RSS"
      icon: "fa fa-rss"
      url:  "./atom.xml"
  copyright: # default is Ãƒâ€šÃ‚Â© <year> <name>

# C. Theming Chulapa
# Full reference: docs/03-theming.
# C.1. Google Fonts
# Google Fonts https://fonts.google.com/, add as many as you need
googlefonts:
  # - url: 'https://fonts.googleapis.com/css2?family=Raleway&family=Rubik&display=swap'

# C.2. Skin, syntax highlighting and colors
chulapa-skin:
  highlight     :  # default["default"]
  skin         : academia # Optional predefined skins
  autothemer    :  true # Bool: Use autotheming
  vars          :
    primary     : "lightskyblue" #default ["#007bff"] - Bootstrap blue
    # font-family-base: "Rubik, sans-serif"
    # headings-font-family: "Raleway, sans-serif"
    # For more Sass variables, see docs/variable-dictionary.

# Optional second skin (2.2.0). Leave blank to disable.
chulapa-skin-dark:
  skin:
  highlight:
  autothemer:
  vars:
    primary:

# D. Jekyll defaults and collections
# Demo collections and pagination below are examples for this repository.

# D.1. Pagination
# Blog pagination: on this site /blog/index.html. https://jekyllrb.com/docs/pagination/
paginate: 4
paginate_path: "/blog/page:num/"
paginator_maxnum: 3  #default[3] Custom: max of number to be displayed on the paginator

# D.2. Collections and permalinks
# https://jekyllrb.com/docs/step-by-step/09-collections/
collections:
  cheatsheet:
    output: true
    permalink: /cheatsheets/:name
collections_dir     : 
permalink           : /:year:month:day_:title/

# Optional series map used by the series navigation snippet.
# Set each series label here and use its ID with a unique integer order in each page's front matter.
# series:
#   first-site:
#     label: First-site guide
#     part_label: Part
#     index_label: Series index

# D.3. Front matter defaults
# https://jekyllrb.com/docs/configuration/front-matter-defaults/
# Theme page options: https://dieghernan.github.io/chulapa/docs/04-layouts
defaults:
  -
    scope:
      path: ""
    values:
      layout: "default"
      robots: "index, follow" # Override per page when needed.
      header_type: "base"
      include_on_search   : false
      cloudtag_url        : /tags #This is where the link on tags would redirect
      cloudcategory_url   : /categories #This is where the link on categories would redirect
  -
    scope:
      path: ""
      type: "posts"
    values:
      header_type       : "post"
      include_on_search : true
      include_on_feed   : true
      show_date         : true
      show_related      : true
      show_bottomnavs   : true
      show_sociallinks  : true
      show_comments     : true
      show_tags         : true
      show_categories   : true
      show_author       : true
      show_toc          : false
      # Enable a citation block on every post (see docs/04-layouts#make-a-post-citable).
      # citation:
      #   type: post-weblog
      show_breadcrumb   : true
      breadcrumb_list   :
        - label: Blog
          url: /blog/
  -
    scope:
      path: ""
      type: "cheatsheet"
    values:
      header_type       : "hero"
      show_bottomnavs   : true
      show_sociallinks  : true
      include_on_search : true
      show_breadcrumb   : true
      breadcrumb_list   :
        - label: Cheatsheets
          url: /cheatsheets
  # Assign a group to gallery images (see docs/29-add-gallery).
  # - scope:
  #     path: "assets/img/gallery"
  #   values:
  #     image_col: gallery

# D.4. Optional jekyll-feed plugin (see docs/57-jekyll-feed).
# Install and enable jekyll-feed separately. Use a path distinct from the theme's feeds.
# feed:
#   path: /feed.xml

# XX. Other settings
# Adapt Jekyll settings to your site; keep jekyll-include-cache enabled.
# XX.1. HTML compression
# - https://jch.penibelst.de/
compress_html:
  clippings: all
  blanklines: true

# XX.2. Plugins
plugins:
  - jekyll-github-metadata
  - jekyll-paginate
  - jekyll-include-cache
  - jekyll-sitemap
  # - jekyll-feed # Enable only if you use the separate feed plugin.

# XX.3. Files to exclude or include
exclude:
  - AGENTS.md
  - LICENSE
  - README.md
  - Gemfile
  - vendor

include:
 - _pages

# XX.4. Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# XX.5. Markdown processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  footnote_backlink: '&uarr;'
  entity_output: as_char
  toc_levels: 2..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# XX.6. Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed # https://sass-lang.com/documentation/file.SASS_REFERENCE.html#output_style
  quiet_deps: true
  silence_deprecations:
    - import
    - global-builtin
    - color-functions
    - abs-percent
    - function-units
